name: Build extension repo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - modules.txt
      - scripts/**
      - .github/workflows/build.yml

permissions:
  contents: write

concurrency:
  group: build-repo
  cancel-in-progress: true

env:
  # Fork that holds the patched sources, and the branch to build from.
  SOURCE_REPO: ultimeus/extensions-source
  SOURCE_REF: deploy

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout builder repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout extensions-source fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: source

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Restore signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: printf '%s' "$SIGNING_KEY" | base64 -d > source/signingkey.jks

      - name: Build extensions
        working-directory: source
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mapfile -t MODULES < <(grep -vE '^\s*(#|$)' ../modules.txt)
          echo "Building: ${MODULES[*]}"
          ./gradlew "${MODULES[@]}" --no-daemon --stacktrace

      - name: Collect signed APKs and JARs
        run: |
          mkdir -p repo/apk repo/jar
          find source -type f -path '*/build/outputs/apk/release/*.apk' -exec cp -v {} repo/apk/ \;
          find source -type f -path '*/build/outputs/jar/release/*.jar' -exec cp -v {} repo/jar/ \;
          echo "APKs collected:"; ls -la repo/apk
          echo "JARs collected:"; ls -la repo/jar

      - name: Generate extension repo
        run: |
          pip install --quiet protobuf
          python scripts/make-repo.py
          cp README.md repo/README.md 2>/dev/null || true

      - name: Publish to repo branch
        run: |
          cd repo
          git init -q
          git checkout -q -b repo
          git add -A
          git -c user.name='repo-bot' -c user.email='repo-bot@users.noreply.github.com' \
              commit -q -m "Update extensions repo"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo:repo
          echo "Published to https://raw.githubusercontent.com/${{ github.repository }}/repo/index.min.json"
