name: Build extension repo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - modules.txt
      - scripts/**
      - .github/workflows/build.yml

permissions:
  contents: write

concurrency:
  group: build-repo
  cancel-in-progress: true

env:
  # Fork that holds the patched sources, and the branch to build from.
  SOURCE_REPO: ultimeus/extensions-source
  SOURCE_REF: deploy

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Checkout extensions-source fork
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: printf '%s' "$SIGNING_KEY" | base64 -d > source/signingkey.jks

      - name: Build extensions
        working-directory: source
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mapfile -t MODULES < <(grep -vE '^\s*(#|$)' ../modules.txt)
          echo "Building: ${MODULES[*]}"
          ./gradlew "${MODULES[@]}" --no-daemon --stacktrace

      - name: Collect signed APKs
        run: |
          mkdir -p repo/apk
          find source -type f -path '*/build/outputs/apk/release/*.apk' -exec cp -v {} repo/apk/ \;
          echo "APKs collected:"; ls -la repo/apk

      - name: Run Inspector + generate repo
        run: |
          pip install --quiet protobuf
          INSPECTOR_URL="$(curl -s https://api.github.com/repos/keiyoushi/extensions-inspector/releases/latest | jq -r '.assets[0].browser_download_url')"
          echo "Inspector: $INSPECTOR_URL"
          curl -L "$INSPECTOR_URL" -o Inspector.jar
          java -jar Inspector.jar "repo/apk" "output.json" "tmp"
          python scripts/make-repo.py
          cp README.md repo/README.md 2>/dev/null || true

      - name: Publish to repo branch
        run: |
          cd repo
          git init -q
          git checkout -q -b repo
          git add -A
          git -c user.name='repo-bot' -c user.email='repo-bot@users.noreply.github.com' \
              commit -q -m "Update extensions repo"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo:repo
          echo "Published to https://raw.githubusercontent.com/${{ github.repository }}/repo/index.min.json"
